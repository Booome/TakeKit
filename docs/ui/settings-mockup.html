<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>TakeKit · 设置（快捷键 / 语言 / 主题）效果图</title>
    <!-- The real panel stylesheet: every frame below reuses the shipped tokens
         and component classes, so what is approved here is what gets built. -->
    <link rel="stylesheet" href="../../crates/takekit-gui/ui/style.css" />
    <style>
      /* ── mockup page ───────────────────────────────────────────────────── */
      html,
      body {
        height: auto;
        margin: 0;
        background: #2a2a2a;
        color: #ededed;
        font:
          13px/1.5 "Segoe UI Variable Text",
          "Segoe UI",
          "Microsoft YaHei UI",
          system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 2000px;
        margin: 0 auto;
        padding: 28px 32px 64px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 6px;
      }
      .lede {
        color: #a9a9a9;
        margin: 0 0 24px;
        max-width: 980px;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 32px;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      figcaption {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: #3d3d3d;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
      }
      .cap-title {
        font-weight: 600;
      }
      .cap-note {
        color: #a9a9a9;
        font-size: 12px;
      }

      /* ── the panel, at its real 900×640 ───────────────────────────────── */
      .stage {
        position: relative;
        width: 900px;
        height: 640px;
        overflow: hidden;
        background: var(--tk-canvas);
        color: var(--tk-text);
        border: 1px solid #444;
      }
      .app {
        height: 100%;
        display: flex;
        flex-direction: column;
        font-family: var(--tk-font-ui);
        font-size: 13px;
        line-height: 1.45;
        user-select: none;
        position: relative;
      }
      .stage.dark {
        --tk-canvas: #191919;
        --tk-surface: #232323;
        --tk-sunken: #2c2c2c;
        --tk-border: #3a3a3a;
        --tk-border-strong: #5a5a5a;
        --tk-text: #f2f2f2;
        --tk-text-2: #a6a6a6;
        --tk-text-3: #8f8f8f;
        --tk-accent: #4c9dff;
        --tk-accent-fg: #0a0a0a;
        --tk-accent-soft: rgba(76, 157, 255, 0.16);
        --tk-rec: #ff5f52;
        --tk-rec-fg: #1a0503;
      }
      .stage.light {
        --tk-canvas: #f4f4f4;
        --tk-surface: #ffffff;
        --tk-sunken: #ececec;
        --tk-border: #d6d6d6;
        --tk-border-strong: #b0b0b0;
        --tk-text: #16161a;
        --tk-text-2: #5c5c5c;
        --tk-text-3: #767676;
        --tk-accent: #0b62c4;
        --tk-accent-fg: #ffffff;
        --tk-accent-soft: rgba(11, 98, 196, 0.12);
        --tk-rec: #ce1f1f;
        --tk-rec-fg: #ffffff;
      }

      /* frame-only helpers */
      .spacer {
        flex: 1;
      }
      .src-empty-pad {
        height: 8px;
      }
      .mock-row-param {
        height: 26px;
        padding: 0 6px;
        font-size: 12px;
        color: var(--tk-text);
        background: var(--tk-surface);
        border: 1px solid var(--tk-border);
        border-radius: var(--tk-radius-sm);
      }

      /* ── proposed components (this is what the design adds) ───────────── */
      /* 1. hotkey chip, in the params row */
      .chip {
        height: 28px;
        min-width: 84px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--tk-font-mono);
        font-size: 12px;
        color: var(--tk-text);
        background: var(--tk-surface);
        border: 1px solid var(--tk-border-strong);
        border-radius: var(--tk-radius-sm);
        transition:
          border-color var(--tk-dur) var(--tk-ease),
          background var(--tk-dur) var(--tk-ease);
      }
      .chip.capturing {
        border: 1px dashed var(--tk-accent);
        background: var(--tk-accent-soft);
        color: var(--tk-accent);
      }
      .chip.error {
        border-color: var(--tk-rec);
        color: var(--tk-rec);
      }
      .chip.ok {
        border-color: var(--tk-ok);
        color: var(--tk-ok);
      }
      .field-note {
        height: 14px;
        font-size: 11px;
        color: var(--tk-text-3);
        white-space: nowrap;
      }
      .field-note.err {
        color: var(--tk-rec);
      }

      /* 2. gear in the tab bar + the settings popover */
      .gear {
        margin-left: auto;
        width: 30px;
        height: 30px;
        margin-bottom: 3px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--tk-text-2);
        background: none;
        border: 0;
        border-radius: var(--tk-radius-sm);
      }
      .gear[aria-expanded="true"] {
        background: var(--tk-sunken);
        color: var(--tk-text);
      }
      .settings {
        position: absolute;
        top: 44px;
        right: 10px;
        width: 268px;
        padding: 14px;
        background: var(--tk-surface);
        border: 1px solid var(--tk-border-strong);
        border-radius: var(--tk-radius-md);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
        z-index: 20;
      }
      .settings h3 {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--tk-text-3);
      }
      .settings .group + .group {
        margin-top: 14px;
      }
      .seg {
        display: flex;
        border: 1px solid var(--tk-border-strong);
        border-radius: var(--tk-radius-sm);
        overflow: hidden;
      }
      .seg button {
        flex: 1;
        height: 28px;
        font-size: 12px;
        color: var(--tk-text-2);
        background: var(--tk-surface);
        border: 0;
        border-right: 1px solid var(--tk-border);
      }
      .seg button:last-child {
        border-right: 0;
      }
      .seg button[aria-pressed="true"] {
        background: var(--tk-accent);
        color: var(--tk-accent-fg);
      }
      .stage .notice {
        position: absolute;
        top: 52px;
        right: 12px;
        width: 320px;
      }
      .settings .hintline {
        margin: 8px 0 0;
        font-size: 11px;
        color: var(--tk-text-3);
      }
      .gear svg {
        width: 16px;
        height: 16px;
      }
      .anno {
        position: absolute;
        font-size: 11px;
        color: var(--tk-accent);
        background: var(--tk-accent-soft);
        border: 1px solid var(--tk-accent);
        border-radius: 999px;
        padding: 1px 8px;
        white-space: nowrap;
      }
      .anno.hotkey {
        left: 706px;
        bottom: 96px;
      }
      .stage.dark .anno {
        color: var(--tk-accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>TakeKit · 设置类功能效果图（待确认）</h1>
      <p class="lede">
        两张设计合并在一页：<b>快捷键控件</b>（B5）、<b>语言 / 主题切换</b>。所有画面都是真实
        900×640 面板、直接引用应用里的 <code>style.css</code> 与组件类，通过后照此实现。
        蓝色小标签只是标注，不属于设计本身。
      </p>

      <div class="grid">
        <!-- 1 -->
        <figure>
          <figcaption>
            <span class="num">1</span>
            <span class="cap-title">参数区新增「快捷键」· 默认态（浅色）</span>
            <span class="cap-note">与鼠标效果、倒计时同排，最右；等宽字体显示当前键</span>
          </figcaption>
          <div class="stage light">
            <div class="app" id="app-1"></div>
          </div>
        </figure>

        <!-- 2 -->
        <figure>
          <figcaption>
            <span class="num">2</span>
            <span class="cap-title">录入中 · 按下组合键</span>
            <span class="cap-note">虚线 + 底色表示正在听键；下方提示 Esc 取消</span>
          </figcaption>
          <div class="stage light">
            <div class="app" id="app-2"></div>
          </div>
        </figure>

        <!-- 3 -->
        <figure>
          <figcaption>
            <span class="num">3</span>
            <span class="cap-title">失败态 · 被占用 / 非法组合</span>
            <span class="cap-note">红边 + 原因，1.5 秒后自动恢复原键；原值不丢</span>
          </figcaption>
          <div class="stage light">
            <div class="app" id="app-3"></div>
          </div>
        </figure>

        <!-- 4 -->
        <figure>
          <figcaption>
            <span class="num">4</span>
            <span class="cap-title">深色主题 · 同一排控件</span>
            <span class="cap-note">深色下 chip 边框与底色跟着 token 走，不另配色</span>
          </figcaption>
          <div class="stage dark">
            <div class="app" id="app-4"></div>
          </div>
        </figure>

        <!-- 5 -->
        <figure>
          <figcaption>
            <span class="num">5</span>
            <span class="cap-title">设置浮层：语言 + 主题</span>
            <span class="cap-note">齿轮在页签右端；两行分段按钮，改完即时生效</span>
          </figcaption>
          <div class="stage light">
            <div class="app" id="app-5"></div>
            <div class="settings" id="settings-5"></div>
          </div>
        </figure>

        <!-- 6 -->
        <figure>
          <figcaption>
            <span class="num">6</span>
            <span class="cap-title">English 整屏（检查文案变长后的挤压）</span>
            <span class="cap-note">参数区仍是单行；若你觉得挤，可改成两行（备选方案见文末说明）</span>
          </figcaption>
          <div class="stage light">
            <div class="app" id="app-6"></div>
          </div>
        </figure>

        <!-- 7 -->
        <figure>
          <figcaption>
            <span class="num">7</span>
            <span class="cap-title">English + 深色（组合态）</span>
            <span class="cap-note">两套设置互不干扰：语言与主题独立持久化</span>
          </figcaption>
          <div class="stage dark">
            <div class="app" id="app-7"></div>
          </div>
        </figure>
      </div>
    </div>

    <script>
      const T = {
        zh: {
          tabs: ["源", "历史", "日志"],
          add: "添加源",
          section: "源",
          rows: [
            ["整个桌面", "屏幕 · 3440×1440", "30", "自动"],
            ["Windows Terminal", "窗口 · 1280×800", "30", "自动"],
          ],
          params: {
            out: "输出目录",
            encoder: "视频编码",
            marks: "鼠标效果",
            countdown: "倒计时",
            hotkey: "快捷键",
          },
          hotkeyNote: "点击后按新的组合键",
          capturing: "按下组合键…",
          capturingNote: "Esc 取消",
          error: "Ctrl+R 已被其他程序占用",
          rec: "开始录制",
          hint: "2 个源",
          settings: {
            language: "语言",
            theme: "主题",
            langs: ["中文", "English"],
            themes: ["跟随系统", "浅色", "深色"],
            note: "语言与主题立即生效，并记住到下次启动。",
          },
        },
        en: {
          tabs: ["Sources", "History", "Log"],
          add: "Add source",
          section: "Sources",
          rows: [
            ["Entire desktop", "Screen · 3440×1440", "30", "Auto"],
            ["Windows Terminal", "Window · 1280×800", "30", "Auto"],
          ],
          params: {
            out: "Output folder",
            encoder: "Video encoder",
            marks: "Mouse effects",
            countdown: "Countdown",
            hotkey: "Hotkey",
          },
          hotkeyNote: "Click, then press a new shortcut",
          capturing: "Press shortcut…",
          capturingNote: "Esc to cancel",
          error: "Ctrl+R is used by another app",
          rec: "Start recording",
          hint: "2 sources",
          settings: {
            language: "Language",
            theme: "Theme",
            langs: ["中文", "English"],
            themes: ["System", "Light", "Dark"],
            note: "Both apply immediately and are remembered.",
          },
        },
      };

      const F9 = "F9";

      function gearIcon() {
        return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round">
          <path d="M2 5h6.5M12.5 5H14M2 11h1.5M7.5 11H14"/>
          <circle cx="10.5" cy="5" r="1.7"/>
          <circle cx="5.5" cy="11" r="1.7"/>
        </svg>`;
      }

      function row([name, meta, fps, q]) {
        return `<div class="row">
          <span class="dot"></span>
          <div class="row-main">
            <div class="row-name">${name}</div>
            <div class="row-meta">${meta}</div>
          </div>
          <select class="mock-row-param"><option>${fps}</option></select>
          <select class="mock-row-param"><option>${q}</option></select>
        </div>`;
      }

      function app(id, lang, hotkey) {
        const t = T[lang];
        const chipClass =
          hotkey.state === "capturing" ? "chip capturing" : hotkey.state === "error" ? "chip error" : "chip";
        const chipText = hotkey.state === "capturing" ? t.capturing : hotkey.state === "error" ? F9 : F9;
        const noteClass = hotkey.state === "error" ? "field-note err" : "field-note";
        // The idle line stays empty on purpose: it was the longest string and
        // overflowed the row at 900px. The line is still reserved, so the
        // params row keeps its height in every state.
        const note = hotkey.state === "capturing" ? t.capturingNote : "";
        document.getElementById(id).innerHTML = `
          <nav class="tabs">
            <button class="tab" aria-selected="true">${t.tabs[0]}</button>
            <button class="tab">${t.tabs[1]}</button>
            <button class="tab">${t.tabs[2]}</button>
            <button class="gear" aria-expanded="${hotkey.settingsOpen ? "true" : "false"}" title="${
              lang === "zh" ? "设置" : "Settings"
            }">${gearIcon()}</button>
          </nav>
          <section class="pane">
            <div class="section-head">
              <h2 class="section-title">${t.section}</h2>
              <button class="ghost">${t.add}</button>
            </div>
            <div class="source-list">${t.rows.map(row).join("")}</div>
          </section>
          <section class="params">
            <div class="field grow">
              <label>${t.params.out}</label>
              <div class="path-row">
                <input class="value mono" value="takes" readonly />
                <button class="browse">…</button>
              </div>
            </div>
            <div class="field">
              <label>${t.params.encoder}</label>
              <select class="value"><option>NVENC</option></select>
            </div>
            <div class="field centered">
              <label>${t.params.marks}</label>
              <input class="switch" type="checkbox" checked />
            </div>
            <div class="field centered">
              <label>${t.params.countdown}</label>
              <input class="switch" type="checkbox" checked />
            </div>
            <div class="field">
              <label>${t.params.hotkey}</label>
              <button class="${chipClass}">${chipText}</button>
              <span class="${noteClass}">${note}</span>
            </div>
          </section>
          <footer class="bar">
            <span class="clock mono">00:00:00</span>
            <span class="hint">${t.hint}</span>
            <button class="rec">${t.rec}</button>
          </footer>
          ${
            hotkey.state === "error"
              ? `<div class="notice error">
                   <span class="dot err"></span>
                   <p>${t.error}</p>
                   <button class="notice-x">✕</button>
                 </div>`
              : ""
          }`;
      }

      function settings(id, lang) {
        const t = T[lang].settings;
        document.getElementById(id).innerHTML = `
          <div class="group">
            <h3>${t.language}</h3>
            <div class="seg">
              <button aria-pressed="${lang === "zh"}">${t.langs[0]}</button>
              <button aria-pressed="${lang === "en"}">${t.langs[1]}</button>
            </div>
          </div>
          <div class="group">
            <h3>${t.theme}</h3>
            <div class="seg">
              <button aria-pressed="true">${t.themes[0]}</button>
              <button aria-pressed="false">${t.themes[1]}</button>
              <button aria-pressed="false">${t.themes[2]}</button>
            </div>
          </div>
          <p class="hintline">${t.note}</p>`;
      }

      app("app-1", "zh", { state: "idle", settingsOpen: false });
      app("app-2", "zh", { state: "capturing", settingsOpen: false });
      app("app-3", "zh", { state: "error", settingsOpen: false });
      app("app-4", "zh", { state: "idle", settingsOpen: false });
      app("app-5", "zh", { state: "idle", settingsOpen: true });
      settings("settings-5", "zh");
      app("app-6", "en", { state: "idle", settingsOpen: false });
      app("app-7", "en", { state: "idle", settingsOpen: false });
    </script>
  </body>
</html>
