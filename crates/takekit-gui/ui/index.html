<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>TakeKit</title>
    <script>
      // Rust seeds the chosen palette before the page loads, so an explicit
      // light/dark does not paint the other one for a frame first. "auto" is
      // left to the stylesheets' media query.
      if (window.__TAKEKIT_THEME__) {
        document.documentElement.dataset.theme = window.__TAKEKIT_THEME__;
      }
    </script>
    <link rel="stylesheet" href="style.css" />
    <script>
      // PROBE-ONLY: proves the HTML asset itself was served and parsed.
      (function () {
        var send = function (stage) {
          try {
            if (window.__TAURI__ && window.__TAURI__.core) {
              window.__TAURI__.core.invoke("ui_ping", { stage: stage });
            }
          } catch (e) {}
        };
        send("html-head");
        window.addEventListener("DOMContentLoaded", function () {
          send("dom-ready");
        });
        window.addEventListener("error", function (ev) {
          send("js-error:" + (ev.message || "?").slice(0, 120));
        });
      })();
    </script>
  </head>
  <body data-tab="sources">
    <!-- The Chinese text in this file is the fallback: it is what a page shows
         if i18n.js never runs, and what `data-i18n` replaces on load. -->
    <nav class="tabs" role="tablist" aria-label="面板" data-i18n-aria="tabs.aria">
      <button
        class="tab"
        id="tab-sources"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="pane-sources"
      >
        <span data-i18n="tab.sources">录制</span>
      </button>
      <button
        class="tab"
        id="tab-history"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="pane-history"
        data-i18n="tab.history"
      >
        历史
      </button>
      <button
        class="tab"
        id="tab-log"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="pane-log"
        data-i18n="tab.log"
      >
        日志
      </button>
      <button
        class="tab"
        id="tab-settings"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="pane-settings"
        data-i18n="tab.settings"
      >
        设置
      </button>
    </nav>

    <section class="pane" id="pane-sources" role="tabpanel" aria-labelledby="tab-sources">
      <div class="section-head">
        <h2 class="section-title" id="sources-title" data-i18n="section.sources">源</h2>
        <button class="ghost" id="add-btn" type="button" data-i18n="sources.add">添加源</button>
      </div>
      <div id="source-list" class="source-list"></div>
      <div id="empty" class="empty">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="1.5" y="2.5" width="13" height="9" rx="1.4" />
            <path d="M5 14h6M8 11.5V14" stroke-linecap="round" />
          </svg>
        </div>
        <p class="empty-title" data-i18n="sources.emptyTitle">还没有源</p>
        <p class="empty-hint" data-i18n="sources.emptyHint">
          添加一个窗口、桌面或摄像头开始录制。
        </p>
      </div>
    </section>

    <section class="pane hidden" id="pane-history" role="tabpanel" aria-labelledby="tab-history">
      <div class="section-head">
        <button class="ghost" id="history-clear" type="button" data-i18n="history.clear">
          清空…
        </button>
      </div>
      <div id="history-list" class="take-list"></div>
      <div id="history-empty" class="empty">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="8" cy="8" r="5.5" />
            <path d="M8 5.5V8l1.8 1.8" stroke-linecap="round" />
          </svg>
        </div>
        <p class="empty-title" data-i18n="history.emptyTitle">还没有录制过</p>
        <p class="empty-hint" data-i18n="history.emptyHint">
          按 F9 或点「开始录制」，录完的那一段会出现在这里。
        </p>
      </div>
    </section>

    <section class="pane hidden" id="pane-log" role="tabpanel" aria-labelledby="tab-log">
      <div class="section-head">
        <button class="ghost" id="log-clear" type="button" data-i18n="history.clear">
          清空…
        </button>
      </div>
      <div id="log-list" class="take-list"></div>
      <div id="log-empty" class="empty">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M3 4h10M3 8h10M3 12h6" stroke-linecap="round" />
          </svg>
        </div>
        <p class="empty-title" data-i18n="log.emptyTitle">没有需要处理的事</p>
        <p class="empty-hint" data-i18n="log.emptyHint">
          源失效、编码失败这类问题会记在这里。
        </p>
      </div>
    </section>

    <section
      class="pane hidden"
      id="pane-settings"
      role="tabpanel"
      aria-labelledby="tab-settings"
    >
      <div class="set-body">
        <div class="set-group">
          <p class="set-label" data-i18n="settings.capture">采集与编码</p>
          <div class="set-row">
            <div class="txt">
              <label class="title" for="backend" data-i18n="params.backend">采集方式</label>
            </div>
            <div class="ctl">
              <select class="value" id="backend">
                <option value="windows" data-i18n="params.backendWindows">
                  Windows API（后台窗口可录）
                </option>
                <option value="ffmpeg" data-i18n="params.backendFfmpeg">ffmpeg</option>
              </select>
            </div>
          </div>
          <div class="set-row">
            <div class="txt">
              <label class="title" for="encoder" data-i18n="params.encoder">视频编码</label>
            </div>
            <div class="ctl">
              <select class="value" id="encoder">
                <option value="" data-i18n="params.encoderAuto">自动</option>
                <option value="nvenc">NVENC</option>
                <option value="qsv">QSV</option>
                <option value="amf">AMF</option>
                <option value="x264">libx264</option>
              </select>
            </div>
          </div>
        </div>
        <div class="set-group">
          <p class="set-label" data-i18n="settings.recording">录制行为</p>
          <div class="set-row">
            <div class="txt">
              <label class="title" for="marks-value" data-i18n="params.marks">鼠标效果</label>
              <span class="hint" data-i18n="params.marksHint"></span>
            </div>
            <div class="ctl">
              <input class="switch" id="marks-value" type="checkbox" role="switch" checked />
            </div>
          </div>
          <div class="set-row">
            <div class="txt">
              <label class="title" for="countdown-value" data-i18n="params.countdown">倒计时</label>
              <span class="hint" data-i18n="params.countdownHint"></span>
            </div>
            <div class="ctl">
              <input class="switch" id="countdown-value" type="checkbox" role="switch" checked />
            </div>
          </div>
          <div class="set-row">
            <div class="txt">
              <label class="title" for="raise-value" data-i18n="params.raise">窗口置前</label>
              <span class="hint" data-i18n="params.raiseHint"></span>
            </div>
            <div class="ctl">
              <input class="switch" id="raise-value" type="checkbox" role="switch" />
            </div>
          </div>
          <div class="set-row">
            <div class="txt">
              <label class="title" for="hotkey-btn" data-i18n="params.hotkey">快捷键</label>
              <!-- The capture hint comes and goes in this slot; its height is
                   reserved so the row list never jumps. -->
              <span class="hint" id="hotkey-note" data-i18n="params.hotkeyHint"></span>
            </div>
            <div class="ctl">
              <button class="chip" id="hotkey-btn" type="button">F9</button>
            </div>
          </div>
        </div>
        <div class="set-group">
          <p class="set-label" data-i18n="settings.interface">界面</p>
          <div class="set-row">
            <div class="txt">
              <label class="title" for="lang-select" data-i18n="settings.language">语言</label>
            </div>
            <div class="ctl">
              <!-- Dropdown like 采集方式 (2026-10-20): the seg block was the
                   one shape on the page that looked foreign. Language names
                   stay in their own language on purpose. -->
              <select class="value" id="lang-select">
                <option value="zh">中文</option>
                <option value="en">English</option>
              </select>
            </div>
          </div>
          <div class="set-row">
            <div class="txt">
              <label class="title" for="theme-select" data-i18n="settings.theme">主题</label>
            </div>
            <div class="ctl">
              <select class="value" id="theme-select">
                <option value="auto" data-i18n="settings.themeAuto">跟随系统</option>
                <option value="light" data-i18n="settings.themeLight">浅色</option>
                <option value="dark" data-i18n="settings.themeDark">深色</option>
              </select>
            </div>
          </div>
        </div>
        <p class="set-note" data-i18n="settings.note">各项设置立即生效，并记住到下次启动。</p>
      </div>
    </section>

    <section class="params" aria-labelledby="params-title">
      <h2 class="sr-only" id="params-title">参数</h2>

      <div class="params-row">
        <div class="field grow">
          <label for="out-path" data-i18n="params.out">输出目录</label>
          <div class="path-row">
            <input class="value mono" id="out-path" type="text" value="takes" spellcheck="false" />
            <button
              class="browse"
              id="out-browse"
              type="button"
              aria-label="选择输出目录"
              title="选择输出目录"
              data-i18n-aria="params.outPick"
              data-i18n-title="params.outPick"
            >
              …
            </button>
          </div>
        </div>
      </div>
    </section>

    <footer class="bar">
      <span class="clock mono" id="clock">00:00:00</span>
      <span class="hint" id="hint">0 个源</span>
      <button class="rec" id="rec-btn" type="button" disabled data-i18n="bar.rec">开始录制</button>
    </footer>

    <div class="notice hidden" id="notice" role="status">
      <span class="dot warn" id="notice-dot"></span>
      <p id="notice-text"></p>
      <button
        class="notice-x"
        id="notice-x"
        type="button"
        title="关闭"
        data-i18n-title="notice.close"
      >
        ✕
      </button>
    </div>

    <div class="popover hidden" id="picker">
      <input
        class="search"
        id="picker-search"
        placeholder="搜索窗口或摄像头…"
        data-i18n-ph="picker.search"
        autocomplete="off"
      />
      <div class="picker-body" id="picker-body"></div>
    </div>


    <script src="shared.js"></script>
    <script src="i18n.js"></script>
    <script src="beep.js"></script>
    <script src="main.js"></script>
  </body>
</html>
