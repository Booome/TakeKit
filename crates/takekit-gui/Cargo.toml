[package]
name = "takekit-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Desktop control panel for TakeKit"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
takekit-core = { path = "../takekit-core" }
takekit-media = { path = "../takekit-media" }
serde.workspace = true
serde_json.workspace = true
rfd = "0.17.2"
tauri-plugin-global-shortcut = "2"
# A second launch must not open a second panel over the first: the plugin
# keeps a Windows named mutex and forwards the launch to the running
# instance's callback (which just raises the window), and the newcomer exits.
tauri-plugin-single-instance = "2"
# The agent's control surface (docs/agent-control.md): a loopback HTTP server.
# tiny_http rather than an async stack because the routes call the same
# blocking functions the panel's commands do, one request at a time — see the
# module's header. getrandom is the bearer token's entropy.
tiny_http = "0.12"
getrandom = "0.2"
# The source editor's preview is one still picture carried to the page as a
# data URL: PNG because a screenshot compresses, and base64 because that is
# what an <img src> takes.
png = "0.17"
base64 = "0.22"

[dependencies.tauri]
version = "2"
features = ["tray-icon"]
