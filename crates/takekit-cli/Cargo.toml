[package]
name = "takekit"
description = "Command-line front end for TakeKit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "takekit"
path = "src/main.rs"

[dependencies]
takekit-core = { path = "../takekit-core" }
takekit-media = { path = "../takekit-media" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
# Talking to the panel's control surface (docs/agent-control.md). No TLS
# feature: the server is loopback-only and plain http://127.0.0.1.
ureq = { version = "2", default-features = false, features = ["json"] }
